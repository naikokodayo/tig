name: Rust migration checkpoint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
      - name: Format, tests and lint
        run: |
          cargo +1.81.0 fmt --all -- --check
          cargo +1.81.0 test --locked --all-targets
          cargo +1.81.0 clippy --locked --all-targets -- -D warnings
          python3 rust/tests/upstream-suite.py --self-test
      - name: Build and test real terminal workflows
        run: |
          cargo +1.81.0 build --locked --release
          python3 rust/tests/terminal-smoke.py
          python3 rust/tests/date-compatibility.py
      - name: Compare non-local epoch formatting with host C Tig
        run: |
          perl -T -MPOSIX -e 'print "$^V\n"'
          make -j2
          python3 rust/tests/date-percent-s.py
          RUSTUP_TOOLCHAIN=1.81.0 python3 rust/tests/upstream-suite.py test/main/date-test test/main/default-test test/main/pretty-raw-test test/main/show-changes-after-rename-test test/main/show-changes-test test/main/update-unstaged-changes-test test/help/default-test
